name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: template1
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: "opentreemap.settings"
      POSTGRES_PASSWORD: password

    steps:
    - uses: actions/checkout@v4

    - name: Add deadsnakes PPA for Python 3.11
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:deadsnakes/ppa
        sudo apt-get update

    - name: Install libpython3.11-dev
      run: sudo apt-get install -y libpython3.11-dev

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r test-requirements.txt
        pip install coveralls

    - name: Install JS dependencies
      run: |
        npm install yarn
        yarn install

    - name: Setup Database
      run: |
        cp ci/local_settings.py opentreemap/opentreemap/settings/local_settings.py
        PGPASSWORD=password psql -h localhost -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS hstore;"
        PGPASSWORD=password psql -h localhost -U postgres -c "CREATE DATABASE ci;"
        PGPASSWORD=password psql -h localhost -U postgres -d ci -c "CREATE EXTENSION IF NOT EXISTS postgis;"
        python opentreemap/manage.py migrate --noinput
        mkdir -p /tmp/otm/static
        mkdir -p /tmp/otm/media
        python opentreemap/manage.py collectstatic_js_reverse
        npm run build
        python opentreemap/manage.py collectstatic --noinput

    - name: Run Tests
      run: |
        flake8 --exclude migrations,opentreemap/settings/local_settings.py,*.pyc opentreemap
        npm run check
        npm run test
        cd opentreemap && coverage run --rcfile=../.coveragerc --source=. manage.py test

    - name: Coveralls
      run: coveralls
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
