name: Django CI

on:
  push:
    branches: ["develop", "feature/modernize-otm"]
  pull_request:
    branches: ["develop", "feature/modernize-otm"]

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Add deadsnakes PPA for Python 3.11
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update

      - name: Install libpython3.11-dev
        run: sudo apt-get install -y libpython3.11-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libpython3.11-dev
          python -m pip install --upgrade pip
          pip install wheel
          pip install -r requirements.txt

      - name: Verify Celery Installation
        run: |
          python -c "import celery; print(celery.__version__)"  # Verify Celery import and version

      - name: Run Tests
        run: |
          cd opentreemap
          python manage.py test
